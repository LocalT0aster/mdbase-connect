previews:
  generation: off

services:
  - type: web
    name: mdbase-connect
    runtime: docker
    repo: https://github.com/mdbase-dev/mdbase-connect
    branch: main
    plan: starter
    region: singapore
    dockerfilePath: ./deploy/docker/Dockerfile.server
    dockerContext: .
    preDeployCommand: node services/server/dist/migrate.js
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    domains:
      - connect.mdbase.dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        value: https://connect.mdbase.dev
      - key: DATABASE_URL
        fromDatabase:
          name: mdbase-connect-db
          property: connectionString
      - key: MDBASE_CONNECT_GITHUB_CLIENT_ID
        sync: false
      - key: MDBASE_CONNECT_GITHUB_CLIENT_SECRET
        sync: false
      - key: MDBASE_CONNECT_ALLOWED_GITHUB_USER_IDS
        sync: false
      - key: MDBASE_CONNECT_HOSTED_COLLECTIONS
        value: "0"
      - key: MDBASE_CONNECT_TRUST_PROXY
        value: "1"
      - key: MDBASE_CONNECT_ALLOW_INSECURE_MANIFESTS
        value: "0"

databases:
  - name: mdbase-connect-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: mdbase_connect
    user: mdbase_connect
    ipAllowList: []
