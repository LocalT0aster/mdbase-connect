name: Publish TaskNotes Connect Images

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full Connect commit compatible with the TaskNotes SDK
        required: true
        type: string
      release_tag:
        description: Annotated compatibility tag resolving to source_commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tasknotes-connect-images-${{ inputs.source_commit }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  IMAGE_NAMESPACE: ghcr.io/localt0aster
  SOURCE_COMMIT: ${{ inputs.source_commit }}

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Validate immutable compatibility release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^tasknotes-v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+-[0-9a-f]{7,40}$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

  publish:
    needs: validate-release
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            package: mdbase-connect-server
            dockerfile: deploy/docker/Dockerfile.server
          - component: nats
            package: mdbase-connect-nats
            dockerfile: deploy/docker/Dockerfile.nats
          - component: hosted-provider
            package: mdbase-connect-hosted-provider
            dockerfile: deploy/docker/Dockerfile.hosted-provider
    env:
      IMAGE: ghcr.io/localt0aster/${{ matrix.package }}

    steps:
      - name: Check out pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SOURCE_COMMIT }}
          build-args: MDBASE_CONNECT_REVISION=${{ env.SOURCE_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attest source identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_ref="$IMAGE@$DIGEST"
          cosign sign --yes "$image_ref"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg component "${{ matrix.component }}" \
            --arg image "$IMAGE" \
            '{repository:$repository, commit:$commit, component:$component, image:$image}' \
            > "$RUNNER_TEMP/release-image.json"
          cosign attest \
            --yes \
            --type https://mdbase.dev/attestations/release-image/v1 \
            --predicate "$RUNNER_TEMP/release-image.json" \
            "$image_ref"

      - name: Record immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
